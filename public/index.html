<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1D3557" />


    <meta
      name="description"
      content="Grupo Dimher SRL — Expertos en desarrollo inmobiliario. Conoce nuestros proyectos, servicios y compromiso con la excelencia en construcción y bienes raíces."
    />
    <meta name="author" content="Grupo Dimher SRL" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

   

    
    <style>
      body {
        margin: 0;
        font-family: "Open Sans", Arial, sans-serif;
        background: linear-gradient(135deg, #1D3557 0%, #2c5282 100%);
        color: #1D3557;
      }

      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      ::selection {
        background-color: #e86a00;
        color: #ffffff;
      }

      

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .info-section {
        background: linear-gradient(135deg, #1D3557, #457b9d);
        color: white;
        padding: 60px 40px;
        position: relative;
      }

      .info-section h2 {
        font-size: 2.2em;
        margin-bottom: 20px;
      }

      .info-section p {
        font-size: 1.05em;
        line-height: 1.6;
        opacity: 0.9;
        margin-bottom: 30px;
      }

      .info-item {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }

      .info-item i {
        font-size: 1.3em;
        margin-right: 15px;
        color: #e86a00;
      }

      .social-links {
        display: flex;
        gap: 15px;
        margin-top: 30px;
      }

      .social-links a {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        transition: 0.3s;
      }

      .social-links a:hover {
        background: #e86a00;
        transform: translateY(-3px);
      }

      .message-form {
        padding: 60px 40px;
      }


      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        background: #f9fafb;
        font-family: inherit;
        transition: all 0.3s ease;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #e86a00;
        background: white;
        box-shadow: 0 0 0 4px rgba(232, 106, 0, 0.1);
      }

      .submit-btn {
        width: 100%;
        background: linear-gradient(135deg, #e86a00, #ff8c32);
        border: none;
        color: white;
        font-weight: 600;
        padding: 15px;
        font-size: 1.1em;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 5px 15px rgba(232, 106, 0, 0.4);
      }


      

      @media (max-width: 900px) {
        .message-section {
          grid-template-columns: 1fr;
        }

        .info-section {
          text-align: center;
        }

        .social-links {
          justify-content: center;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root"></div>

    

    <script>
      document.getElementById("messageForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const msg = document.getElementById("successMessage");
        msg.style.display = "block";
        e.target.reset();
        setTimeout(() => (msg.style.display = "none"), 4000);
      });
    </script>
  </body>
</html>
